<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>AON — Admin Edits</title>
<!-- Font self-hosted come il resto del sito. Qui conta anche il fatto che il
     pannello continui a funzionare identico senza rete verso Google. -->
<link rel="stylesheet" href="/fonts/fonts.css" />
<!-- React, ReactDOM e Babel non arrivano piu' da unpkg: qui il rischio era
     peggiore che sul sito pubblico, perche' se il CDN non rispondeva Andrea si
     trovava un pannello bianco e non poteva pubblicare nulla.
     Sorgente: src/admin.jsx -> assets/admin.js (npm run build). -->
<style>
  :root{
    --bg:#000000; --fg:#FFFFFF; --mute:#707070;
    --line:rgba(255,255,255,0.14); --line-strong:rgba(255,255,255,0.32);
    --accent:#FF3D00; --ok:#4ade80;
    --ease-out:cubic-bezier(0.22,1,0.36,1);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#000;}
  .display{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.025em;line-height:0.92;}
  .grot{font-family:'Bricolage Grotesque',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .uline{letter-spacing:0.18em;text-transform:uppercase;}
  input,button,textarea,select{font-family:inherit;color:inherit;}
  button{cursor:pointer;background:none;border:none;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:#0a0a0a;}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:0;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}

  .field{
    width:100%;background:#0c0c0c;border:1px solid var(--line);
    padding:9px 11px;font-size:12px;color:var(--fg);outline:none;
    transition:border-color .2s var(--ease-out);
  }
  .field:focus{border-color:var(--accent);}
  .field.sm{padding:6px 8px;font-size:11px;}
  .lbl{font-size:9px;color:var(--mute);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:4px;display:block;}

  .btn{
    border:1px solid var(--line-strong);padding:9px 16px;font-size:11px;
    letter-spacing:0.14em;text-transform:uppercase;font-weight:700;
    transition:all .2s var(--ease-out);white-space:nowrap;
  }
  .btn:hover{background:var(--fg);color:#000;border-color:var(--fg);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#000;}
  .btn-accent:hover{background:#fff;border-color:#fff;color:#000;}
  .btn-ghost{border-color:var(--line);color:var(--mute);}
  .btn-ghost:hover{background:#161616;color:#fff;border-color:var(--line-strong);}
  .btn-xs{padding:4px 8px;font-size:9px;letter-spacing:0.1em;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:disabled:hover{background:none;color:var(--mute);border-color:var(--line);}

  .card{
    border:1px solid var(--line);background:#070707;
    transition:border-color .2s var(--ease-out);
  }
  .card:hover{border-color:var(--line-strong);}

  .tab{
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;
    padding:10px 4px;color:var(--mute);border-bottom:2px solid transparent;
    transition:color .2s var(--ease-out),border-color .2s var(--ease-out);
  }
  .tab:hover{color:var(--fg);}
  .tab.active{color:var(--fg);border-color:var(--accent);}

  .thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#111;display:block;filter:grayscale(0.15);}

  /* ── Drag & drop ─────────────────────────────────────────────────────── */
  .drop{position:relative;}
  .drop::after{
    content:attr(data-hint);position:absolute;inset:0;z-index:4;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;
    text-transform:uppercase;color:#fff;background:rgba(255,61,0,0.16);
    border:2px dashed var(--accent);opacity:0;pointer-events:none;
    transition:opacity .15s var(--ease-out);padding:8px;
  }
  .drop.over::after{opacity:1;}
  .drop-idle{
    border:1px dashed var(--line-strong);color:var(--mute);
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.14em;
    text-transform:uppercase;text-align:center;padding:14px 8px;
    transition:border-color .2s var(--ease-out),color .2s var(--ease-out);
  }
  .drop.over .drop-idle{border-color:var(--accent);color:#fff;}

  .vbadge{
    position:absolute;top:3px;right:3px;z-index:3;
    background:rgba(0,0,0,0.78);border:1px solid var(--accent);color:var(--accent);
    font-family:'JetBrains Mono',monospace;font-size:8px;padding:0 4px;letter-spacing:0.06em;
  }
  .chip{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:0.1em;text-transform:uppercase;padding:3px 7px;
    border:1px solid var(--line);color:var(--mute);
  }
  .chip.ok{border-color:#1f7a3a;color:var(--ok);}
  .chip.err{border-color:var(--accent);color:var(--accent);}
  .panel{border:1px solid var(--accent);background:#0b0b0b;padding:12px;}
  details.help{border:1px solid var(--line);background:#070707;padding:12px 14px;}
  details.help summary{
    cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);
  }
  details.help ol{margin:12px 0 0 18px;}
  details.help li{font-size:12px;color:#c9c9c9;margin-bottom:7px;line-height:1.5;}
  details.help code{font-family:'JetBrains Mono',monospace;font-size:11px;background:#141414;padding:1px 5px;border:1px solid var(--line);}

  /* ── Impostazioni generali ───────────────────────────────────────────── */
  .set-group{border:1px solid var(--line);background:#070707;padding:16px;}
  .set-group + .set-group{margin-top:14px;}
  .set-group h3{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px;
  }
  .set-group .hint{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:#666;
    line-height:1.6;margin-bottom:14px;
  }
  .set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  textarea.field{resize:vertical;min-height:96px;line-height:1.6;}

  /* Checkbox "Contenuto Enhanced con AI": riga cliccabile, non una spunta
     minuscola persa nel form. */
  .check{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    border:1px solid var(--line);background:#0c0c0c;padding:9px 11px;
    transition:border-color .2s var(--ease-out),background .2s var(--ease-out);
  }
  .check:hover{border-color:var(--line-strong);}
  .check.on{border-color:var(--accent);background:#140803;}
  .check input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;cursor:pointer;}
  .check span{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--mute);line-height:1.4;
  }
  .check.on span{color:var(--fg);}

  .row-mq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;}
  .row-mq + .row-mq{margin-top:8px;}
  @media (max-width:640px){ .row-mq{grid-template-columns:1fr;} }

  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin .8s linear infinite;}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .toast{animation:slideUp .3s var(--ease-spring);}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .fade{animation:fadeIn .35s var(--ease-out);}
</style>
</head>
<body>
<div id="root"></div>

<script src="/assets/admin.js?v=e096c218" defer></script>
</body>
</html>
