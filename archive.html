<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea Onori — L'Archive · Vol. III</title>
    <meta name="description" content="A photographer's archive. Editorial · portrait · personal work.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230A0A0A%22/><circle cx=%2250%22 cy=%2250%22 r=%2225%22 fill=%22%23C9985A%22/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500;1,9..144,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

    <style>
        :root {
            --bg: #0A0908;
            --paper: #11100E;
            --fg: #E8E1D2;
            --mute: #6F6B5F;
            --accent: #C9985A;
            --accent-soft: rgba(201, 152, 90, 0.5);
            --line: #1F1D18;
            --line-soft: rgba(232, 225, 210, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: var(--bg); color: var(--fg); }
        body {
            font-family: 'Crimson Pro', serif;
            font-weight: 400;
            cursor: none;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--accent); color: var(--bg); }

        /* Grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.88 0 0 0 0 0.78 0 0 0 0.05 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            z-index: 1000;
            mix-blend-mode: overlay;
            opacity: 0.85;
        }
        /* Vignette */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.45) 100%);
            z-index: 999;
        }

        /* Light leak */
        .light-leak {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 45vw;
            height: 45vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,152,90,0.12) 0%, transparent 60%);
            pointer-events: none;
            z-index: 998;
            animation: drift 18s ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0,0); opacity: 0.7; }
            50% { transform: translate(-3%,4%); opacity: 1; }
        }

        .display { font-family: 'Fraunces', serif; font-variation-settings: "opsz" 144, "SOFT" 0, "WONK" 1; }
        .serif { font-family: 'Crimson Pro', serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom cursor */
        .cur {
            position: fixed;
            width: 24px; height: 24px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10001;
            transition: transform 0.18s cubic-bezier(.4,0,.2,1), width .25s, height .25s, background .25s;
            transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            mix-blend-mode: difference;
        }
        .cur::before, .cur::after {
            content: ''; position: absolute;
            background: var(--accent);
        }
        .cur::before { width: 1px; height: 8px; }
        .cur::after { width: 8px; height: 1px; }
        .cur.hover {
            width: 70px; height: 70px;
            background: rgba(201, 152, 90, 0.15);
            backdrop-filter: blur(2px);
        }
        .cur.hover::before, .cur.hover::after { display: none; }
        .cur .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.15em;
            color: var(--accent);
            display: none;
            text-transform: uppercase;
        }
        .cur.hover .label { display: block; }
        @media (max-width: 768px) {
            body { cursor: auto; }
            .cur { display: none; }
        }

        /* Switch */
        .vswitch {
            position: fixed;
            top: 16px; left: 16px;
            z-index: 50;
            display: inline-flex;
            border: 1px solid var(--accent);
            background: rgba(10,9,8,0.75);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        @media (max-width: 768px) {
            .vswitch { top: 16px; left: auto; right: 16px; }
        }
        .vswitch a {
            padding: 9px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--mute);
            text-decoration: none;
            transition: all .25s ease;
        }
        .vswitch a.active { background: var(--accent); color: var(--bg); }
        .vswitch a:not(.active):hover { color: var(--accent); }

        /* HUD top-right */
        .hud {
            position: fixed;
            top: 16px; right: 16px;
            z-index: 50;
            text-align: right;
            pointer-events: none;
        }
        @media (max-width: 768px) { .hud { display: none; } }
        .hud-row {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--mute);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: rgba(10,9,8,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            padding: 5px 9px;
            margin-bottom: 6px;
            display: inline-block;
        }

        /* Frame markers */
        .frame { position: relative; }
        .frame::before, .frame::after {
            content: ''; position: absolute;
            width: 14px; height: 14px;
            pointer-events: none;
            z-index: 3;
        }
        .frame::before {
            top: -1px; left: -1px;
            border-top: 1px solid var(--fg);
            border-left: 1px solid var(--fg);
        }
        .frame::after {
            bottom: -1px; right: -1px;
            border-bottom: 1px solid var(--fg);
            border-right: 1px solid var(--fg);
        }

        /* Buttons */
        .btn-primary {
            background: var(--accent); color: var(--bg);
            padding: 12px 28px; border: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.18em;
            transition: all .5s cubic-bezier(.4,0,.2,1);
            cursor: none;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-primary:hover { background: var(--fg); transform: translateY(-1px); }
        .btn-secondary {
            background: transparent; color: var(--fg);
            padding: 12px 28px;
            border: 1px solid var(--fg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.18em;
            transition: all .5s cubic-bezier(.4,0,.2,1);
            cursor: none;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        /* Verified */
        .verified {
            display: inline-block;
            width: 9px; height: 9px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 10px;
            vertical-align: middle;
            transform: translateY(-4px);
        }

        /* Issue header */
        .issue-header {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 10px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--mute);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .issue-header strong { color: var(--fg); font-weight: 500; }

        /* Hero quote */
        .hero-quote {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-variation-settings: "opsz" 144, "SOFT" 100;
            font-size: clamp(36px, 5.5vw, 78px);
            line-height: 1.0;
            color: var(--fg);
            letter-spacing: -0.015em;
        }
        .hero-quote .accent { color: var(--accent); }

        /* Stat */
        .stat-num {
            font-family: 'Fraunces', serif;
            font-weight: 400;
            font-variation-settings: "opsz" 96;
            font-size: 44px;
            line-height: 1;
            color: var(--fg);
        }

        /* Chapters */
        .chap {
            width: 84px; height: 84px;
            border-radius: 50%;
            border: 1px solid var(--fg);
            overflow: hidden;
            transition: all .5s cubic-bezier(.4,0,.2,1);
            background: var(--paper);
            position: relative;
        }
        .chap::after {
            content: '';
            position: absolute;
            inset: -5px;
            border: 1px solid transparent;
            border-radius: 50%;
            transition: border .35s ease;
        }
        .chap:hover { border-color: var(--accent); transform: scale(1.05); }
        .chap:hover::after { border-color: var(--accent-soft); }
        .chap img {
            width: 100%; height: 100%; object-fit: cover;
            filter: saturate(0.3) brightness(0.85) contrast(1.05);
            transition: filter .35s ease;
        }
        .chap:hover img { filter: saturate(0.55) brightness(0.95); }

        /* Tabs */
        .tab-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            padding: 18px 0;
            background: none;
            border: none;
            cursor: none;
            color: var(--mute);
            transition: color .4s ease;
            flex: 1;
        }
        .tab-btn.active { color: var(--fg); }
        .tab-btn:hover { color: var(--accent); }
        .tab-indicator {
            position: absolute;
            bottom: 0; height: 1px;
            background: var(--accent);
            transition: all .5s cubic-bezier(.4,0,.2,1);
        }

        /* Feed grid */
        .feed-item {
            position: relative;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid var(--line);
            cursor: none;
        }
        .feed-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 1.6s cubic-bezier(.2,.7,.2,1), filter .6s ease;
            filter: grayscale(50%) sepia(8%) contrast(1.05);
        }
        .feed-item:hover img { transform: scale(1.05); filter: grayscale(0%) sepia(0%); }

        .feed-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10,9,8,0.92);
            opacity: 0;
            transition: opacity .55s cubic-bezier(.4,0,.2,1);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
            text-align: center;
        }
        .feed-item:hover .feed-overlay { opacity: 1; }
        .feed-overlay .title {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 22px;
            font-variation-settings: "opsz" 144, "SOFT" 100;
            color: var(--fg);
            margin-bottom: 12px;
        }
        .feed-overlay .meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--accent);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            line-height: 1.7;
        }
        .feed-overlay .divider {
            width: 30px; height: 1px;
            background: var(--accent);
            margin: 12px auto;
            opacity: 0.5;
        }

        /* Plate number */
        .plate {
            position: absolute;
            top: 10px; left: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--fg);
            background: rgba(10,9,8,0.65);
            padding: 3px 7px;
            letter-spacing: 0.18em;
            opacity: 0;
            transition: opacity .35s ease;
            z-index: 2;
        }
        .feed-item:hover .plate { opacity: 1; }

        /* Index */
        .index-row {
            padding: 22px 0;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 50px 1fr 200px 30px;
            gap: 24px;
            align-items: center;
            transition: all .5s cubic-bezier(.4,0,.2,1);
            cursor: none;
            position: relative;
        }
        .index-row:hover { color: var(--accent); padding-left: 14px; }
        .index-row .arr { transition: transform .4s ease; }
        .index-row:hover .arr { transform: translateX(8px); }
        .index-row:hover .index-prev { opacity: 1; transform: translateX(0); }
        .index-prev {
            position: absolute;
            right: 70px;
            top: 50%;
            margin-top: -60px;
            width: 120px; height: 120px;
            border: 1px solid var(--accent);
            opacity: 0;
            transform: translateX(20px);
            transition: all .5s cubic-bezier(.4,0,.2,1);
            pointer-events: none;
            z-index: 5;
        }
        .index-prev img { width: 100%; height: 100%; object-fit: cover; }
        @media (max-width: 768px) {
            .index-row { grid-template-columns: 40px 1fr 30px; gap: 14px; }
            .index-row .hide-mobile { display: none; }
            .index-prev { display: none; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(5,5,4,0.96);
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(16px);
            padding: 20px;
            overflow-y: auto;
            animation: modalIn .55s cubic-bezier(.4,0,.2,1);
        }
        @keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }

        /* Stagger reveal */
        .fade-in > * { animation: fadeUp 1s cubic-bezier(.2,.7,.2,1) backwards; }
        .fade-in > *:nth-child(1) { animation-delay: 0s; }
        .fade-in > *:nth-child(2) { animation-delay: 0.18s; }
        .fade-in > *:nth-child(3) { animation-delay: 0.36s; }
        .fade-in > *:nth-child(4) { animation-delay: 0.5s; }
        .fade-in > *:nth-child(5) { animation-delay: 0.65s; }
        .fade-in > *:nth-child(6) { animation-delay: 0.8s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }

        /* Footer */
        footer { margin-top: 100px; padding: 50px 0 30px; border-top: 1px solid var(--line); }
        .colofone {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 28px;
            margin-bottom: 50px;
        }
        .colofone h4 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--mute);
            margin-bottom: 8px;
        }
        .colofone p {
            font-family: 'Crimson Pro', serif;
            font-size: 16px;
            color: var(--fg);
            line-height: 1.4;
        }
        .colofone p.italic { font-style: italic; color: var(--accent); }
    </style>
</head>
<body>

    <div class="cur"><span class="label">VIEW</span></div>

    <div class="vswitch">
        <a href="./bold.html">BOLD / 01</a>

    <div class="hud">
        <div class="hud-row">VOL. III · MMXXV</div>

    </div>

    <div id="root"></div>

    <script>
        // Custom cursor — vanilla JS, runs once after DOM ready
        window.addEventListener('DOMContentLoaded', () => {
            const cursor = document.querySelector('.cur');
            if (!cursor) return;
            const move = (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            };
            const hover = (e) => {
                if (e.target.closest('.feed-item, .chap, button, a, .index-row, .vswitch')) {
                    cursor.classList.add('hover');
                } else {
                    cursor.classList.remove('hover');
                }
            };
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseover', hover);
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const UNSPLASH = [
            'https://images.unsplash.com/photo-1509631179647-0177331693ae?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1496345875659-11f7dd282d1d?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1492681290082-e932832941e6?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=900&h=900&fit=crop&q=85',

        const Avatar = () => (

                <img

        const HeroQuote = () => (

                    — Notes from the field, 2025
                </p>
            </div>
        );

        const ProfileHeader = () => (
            <div className="flex flex-col md:flex-row gap-10 md:gap-14 items-start mb-12 fade-in">
                <Avatar />
                <div className="flex-1 w-full">
                    <div className="mb-3">
                        <p className="mono" style={{ fontSize: '9px', color: 'var(--mute)', letterSpacing: '0.25em', textTransform: 'uppercase' }}>
                            ◌ Photographer & visual archivist
                        </p>
                    </div>
                    <h1 className="display flex items-center" style={{ fontSize: 'clamp(36px, 5vw, 56px)', fontWeight: 400, letterSpacing: '-0.02em' }}>
                        Andrea Onori<span className="verified"></span>
                    </h1>
                    <p className="mono mb-7 mt-2" style={{ fontSize: '11px', color: 'var(--mute)', letterSpacing: '0.18em' }}>

                    </p>

                    <div className="flex gap-12 mb-8">
                        <div>
                            <div className="stat-num">247</div>
                            <div className="mono mt-1" style={{ fontSize: '9px', color: 'var(--mute)', letterSpacing: '0.22em', textTransform: 'uppercase' }}>works</div>
                        </div>
                        <div>
                            <div className="stat-num">XII</div>
                            <div className="mono mt-1" style={{ fontSize: '9px', color: 'var(--mute)', letterSpacing: '0.22em', textTransform: 'uppercase' }}>series</div>
                        </div>
                        <div>
                            <div className="stat-num">89</div>
                            <div className="mono mt-1" style={{ fontSize: '9px', color: 'var(--mute)', letterSpacing: '0.22em', textTransform: 'uppercase' }}>published</div>
                        </div>
                    </div>

                    <div className="mb-7 space-y-2">
                        <p className="serif" style={{ fontStyle: 'italic', fontSize: '20px', color: 'var(--fg)', lineHeight: 1.4 }}>A photographer's archive.</p>
                        <p className="serif" style={{ fontSize: '15px', color: 'var(--mute)' }}>Editorial · portrait · personal work.</p>
                        <p className="serif" style={{ fontSize: '15px', color: 'var(--mute)' }}>Tearsheets, prints, and select commissions.</p>
                    </div>

                    <a href="#" className="mono inline-block mb-7" style={{ fontSize: '12px', color: 'var(--accent)', borderBottom: '1px solid var(--accent-soft)', paddingBottom: '2px' }}>

                    <div className="flex gap-3 flex-wrap mt-4">
                        <button className="btn-primary">Get in touch →</button>
                        <button className="btn-secondary">Available for work</button>
                    </div>
                </div>
            </div>
        );

        // Chapters
        const Chapters = ({ onClick }) => {
            const chapters = [
                { id: 'editorial', label: 'editorial', count: 'XXXII', image: UNSPLASH[0] },
                { id: 'portraits', label: 'portraits', count: 'XLVII', image: UNSPLASH[1] },
                { id: 'travel', label: 'travel', count: 'XVIII', image: UNSPLASH[2] },
                { id: 'backstage', label: 'backstage', count: 'XXIV', image: UNSPLASH[3] },
                { id: '2025', label: 'MMXXV', count: 'XII', image: UNSPLASH[4] },
                { id: 'archive', label: 'archivio', count: 'CXIV', image: UNSPLASH[5] },
            ];
            return (
                <div className="mb-14">
                    <div className="flex items-baseline justify-between mb-5 pb-2" style={{ borderBottom: '1px solid var(--line)' }}>
                        <div className="mono" style={{ fontSize: '10px', letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--mute)' }}>
                            <em style={{ fontFamily: 'Crimson Pro, serif', fontStyle: 'italic', textTransform: 'none', letterSpacing: 'normal' }}>i.</em> &nbsp;Chapters
                        </div>
                        <div className="mono" style={{ fontSize: '9px', color: 'var(--mute)', letterSpacing: '0.22em' }}>VI VOLUMES</div>
                    </div>
                    <div className="flex gap-8 overflow-x-auto pb-2">
                        {chapters.map((c, i) => (
                            <div key={c.id} className="flex flex-col items-center gap-2.5 flex-shrink-0" onClick={() => onClick(c)} style={{ cursor: 'none' }}>
                                <div className="chap">
                                    <img src={c.image} alt={c.label} />
                                </div>
                                <div className="text-center">
                                    <div className="serif" style={{ fontSize: '13px', fontStyle: 'italic', color: 'var(--fg)' }}>{c.label}</div>
                                    <div className="mono" style={{ fontSize: '9px', color: 'var(--accent)', letterSpacing: '0.15em', marginTop: '2px' }}>—{c.count}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Tabs
        const Tabs = ({ active, setActive }) => {
            const tabs = ['FRAMES', 'MOTION', 'INDEX'];
            const refs = useRef([]);
            const [ind, setInd] = useState({ left: 0, width: 0 });
            useEffect(() => {
                const idx = tabs.indexOf(active);
                const el = refs.current[idx];
                if (el) setInd({ left: el.offsetLeft, width: el.offsetWidth });
            }, [active]);
            return (
                <div className="mb-10 relative" style={{ borderTop: '1px solid var(--line)', borderBottom: '1px solid var(--line)' }}>
                    <div className="flex">
                        {tabs.map((t, i) => (
                            <button
                                key={t}
                                ref={(el) => (refs.current[i] = el)}
                                className={`tab-btn ${active === t ? 'active' : ''}`}
                                onClick={() => setActive(t)}
                            >
                                <em style={{ fontFamily: 'Crimson Pro, serif', fontStyle: 'italic', color: 'var(--mute)', marginRight: '8px', textTransform: 'none', letterSpacing: 'normal', fontSize: '13px' }}>
                                    {['i.','ii.','iii.'][i]}
                                </em>
                                {t}
                            </button>
                        ))}
                    </div>
                    <div className="tab-indicator" style={{ left: `${ind.left}px`, width: `${ind.width}px` }}></div>
                </div>
            );
        };

        // Feed
        const FeedGrid = ({ onClick }) => {
            const images = UNSPLASH.map((url, i) => ({
                url,
                title: ['Notturno','Ritratti Urbani','Chiaro di Luna','Cinema Verite','Senza Titolo','Protocollo','Ombre','Luce Diretta','Backstage','Sera','Metropoli','Riflessi'][i],
                year: i < 4 ? '2024' : '2025',
                camera: i % 3 === 0 ? 'Leica M6' : i % 3 === 1 ? 'Hasselblad 503' : 'Leica M11',
                film: i % 3 === 0 ? 'Portra 400' : i % 3 === 1 ? 'Tri-X 400' : 'Digital',
                aperture: ['f/2.8','f/4','f/5.6','f/2','f/8','f/2.8'][i % 6],
                loc: ['Roma','Milano','Venezia','Milano','Firenze','Milano','Napoli','Torino','Bologna','Roma','Milano','Venezia'][i],
            }));
            return (
                <div className="grid grid-cols-3 gap-px" style={{ background: 'var(--line)' }}>
                    {images.map((img, i) => (
                        <div key={i} className="feed-item" style={{ aspectRatio: '1/1', border: 'none' }} onClick={() => onClick(i, images)}>
                            <span className="plate">PL. {String(i + 1).padStart(3, '0')}</span>
                            <img src={img.url} alt={img.title} />
                            <div className="feed-overlay">
                                <div className="title">{img.title}</div>
                                <div className="meta">{img.camera}</div>
                                <div className="divider"></div>
                                <div className="meta">{img.film}</div>
                                <div className="meta" style={{ marginTop: '4px' }}>{img.aperture} · {img.loc}, {img.year}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const MotionGrid = () => {
            const videos = [
                'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1524522173746-f628baad3644?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1513097633097-329a3a64e0d4?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1495556650867-99590cea3657?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1499510318569-1a3d67dc3976?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1516962126636-27ad087061cc?w=500&h=900&fit=crop&q=85',
                'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=500&h=900&fit=crop&q=85',
            ];
            return (
                <div className="grid grid-cols-3 gap-px" style={{ background: 'var(--line)' }}>
                    {videos.map((v, i) => (
                        <div key={i} className="feed-item" style={{ aspectRatio: '9/16', border: 'none' }}>
                            <img src={v} alt={`Motion ${i+1}`} />
                            <div className="mono absolute top-2 right-2" style={{
                                background: 'rgba(10,9,8,0.7)',
                                padding: '3px 7px',
                                fontSize: '9px',
                                letterSpacing: '0.15em',
                                color: 'var(--accent)',
                            }}>0:{String(i+7).padStart(2,'0')}</div>
                            <div className="feed-overlay">
                                <div className="title">Reel №{String(i+1).padStart(2,'0')}</div>
                                <div className="meta">MMXXV</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const IndexView = ({ onClick }) => {
            const projects = [
                { num: 'I', title: 'NOTTURNO ROMANO', location: 'Roma · 2024', image: UNSPLASH[0] },
                { num: 'II', title: 'PROTOCOLLO NOTTURNO', location: 'Roma · 2024', image: UNSPLASH[5] },
                { num: 'III', title: 'CHIARO DI LUNA', location: 'Venezia · 2024', image: UNSPLASH[2] },
                { num: 'IV', title: 'CINEMA VERITE', location: 'Milano · 2024', image: UNSPLASH[3] },
                { num: 'V', title: 'SENZA TITOLO', location: 'Firenze · 2025', image: UNSPLASH[4] },
                { num: 'VI', title: 'OMBRE E LUCE', location: 'Napoli · 2025', image: UNSPLASH[6] },
                { num: 'VII', title: 'RITRATTI URBANI', location: 'Torino · 2024', image: UNSPLASH[1] },
                { num: 'VIII', title: 'BACKSTAGE SERIES', location: 'Bologna · 2025', image: UNSPLASH[7] },
            ];
            return (
                <div className="max-w-4xl mx-auto">
                    <div className="mono mb-2 pb-3" style={{ fontSize: '9px', letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--mute)', borderBottom: '1px solid var(--line)' }}>
                        <div className="grid items-center" style={{ gridTemplateColumns: '50px 1fr 200px 30px', gap: '24px' }}>
                            <div>№</div>
                            <div>Title</div>
                            <div className="hide-mobile">Location · Year</div>
                            <div></div>
                        </div>
                    </div>
                    {projects.map((p, i) => (
                        <div key={i} className="index-row mono" onClick={() => onClick(i, projects)} style={{ textTransform: 'uppercase', letterSpacing: '0.15em', fontSize: '11px' }}>
                            <div style={{ color: 'var(--mute)', textTransform: 'none', letterSpacing: 'normal', fontFamily: 'Crimson Pro, serif', fontStyle: 'italic', fontSize: '15px' }}>{p.num}.</div>
                            <div>{p.title}</div>
                            <div className="hide-mobile" style={{ color: 'var(--mute)', textTransform: 'none', letterSpacing: 'normal', fontFamily: 'Crimson Pro, serif', fontStyle: 'italic', fontSize: '13px' }}>{p.location}</div>
                            <div className="text-right arr" style={{ color: 'var(--accent)' }}>→</div>
                            <div className="index-prev"><img src={p.image} alt={p.title} /></div>
                        </div>
                    ))}
                </div>
            );
        };

        // Chapter Modal
        const ChapterModal = ({ chapter, onClose }) => {
            const images = UNSPLASH.slice(0, 5);
            useEffect(() => {
                const onKey = (e) => e.key === 'Escape' && onClose();
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="max-w-md w-full" onClick={e => e.stopPropagation()} style={{ background: 'var(--paper)', border: '1px solid var(--line)', maxHeight: '85vh', overflowY: 'auto' }}>
                        <div className="flex justify-between items-baseline p-6 sticky top-0" style={{ background: 'var(--paper)', borderBottom: '1px solid var(--line)' }}>
                            <h2 className="display" style={{ fontSize: '26px', fontStyle: 'italic', color: 'var(--fg)' }}>{chapter.label}</h2>
                            <button onClick={onClose} className="mono" style={{ fontSize: '10px', color: 'var(--accent)', background: 'none', border: 'none', letterSpacing: '0.18em', cursor: 'none' }}>CLOSE ×</button>
                        </div>
                        <div className="p-6 space-y-6">
                            {images.map((url, i) => (
                                <div key={i} className="frame">
                                    <img src={url} alt="" className="w-full" style={{ border: '1px solid var(--line)', filter: 'sepia(5%)' }} />
                                    <p className="mono mt-2" style={{ fontSize: '9px', letterSpacing: '0.18em', color: 'var(--mute)', textTransform: 'uppercase' }}>
                                        Pl. {String(i + 1).padStart(3, '0')} &nbsp;·&nbsp; 2025
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Post Modal
        const PostModal = ({ idx, images, onClose, onNext, onPrev }) => {
            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight') onNext();
                    if (e.key === 'ArrowLeft') onPrev();
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose, onNext, onPrev]);

            const img = images[idx];
            const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="max-w-6xl w-full flex flex-col md:flex-row gap-10 items-start" onClick={e => e.stopPropagation()}>
                        <div className="flex-1 max-w-3xl">
                            <div className="frame">
                                <img src={img.url} alt={img.title} className="w-full" style={{ filter: 'sepia(5%) contrast(1.04)' }} />
                            </div>
                        </div>
                        <div className="w-full md:w-80 space-y-6">
                            <p className="mono" style={{ fontSize: '10px', color: 'var(--accent)', letterSpacing: '0.22em' }}>
                                Plate {roman[idx]} of {roman[images.length - 1]}
                            </p>
                            <h2 className="display" style={{ fontSize: '36px', fontStyle: 'italic', fontWeight: 400 }}>{img.title}</h2>

                            <div className="space-y-1 mono" style={{ fontSize: '11px', color: 'var(--mute)', letterSpacing: '0.1em' }}>
                                <p>{img.camera || 'Leica M6'} · {img.film || 'Portra 400'}</p>
                                <p>{img.aperture || 'f/2.8'} · 1/125s · ISO 400</p>
                                <p>{img.location || img.loc || 'Roma'}, Italia &nbsp;·&nbsp; {img.year}</p>
                            </div>

                            <p className="serif" style={{ fontSize: '16px', fontStyle: 'italic', lineHeight: 1.55, color: 'var(--fg)' }}>
                                Captured during the quiet hours when the city reveals its character. The interplay of artificial light and shadow creates a cinematic quality that transforms ordinary moments into something timeless.
                            </p>

                            <div className="pt-2 mono" style={{ fontSize: '10px', letterSpacing: '0.18em', color: 'var(--mute)', textTransform: 'uppercase' }}>
                                Edition 03 / XII · Signed & numbered
                            </div>

                            <div className="flex gap-6 pt-4">
                                <button onClick={onPrev} className="mono" style={{ background:'none', border:'none', color:'var(--fg)', cursor:'none', fontSize:'10px', letterSpacing:'0.18em' }}>← PREV</button>
                                <button onClick={onNext} className="mono" style={{ background:'none', border:'none', color:'var(--fg)', cursor:'none', fontSize:'10px', letterSpacing:'0.18em' }}>NEXT →</button>
                            </div>

                            <button className="btn-primary mt-4">Inquire about this print →</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Footer = () => (
            <footer>
                <div className="text-center mb-14">
                    <p className="display" style={{ fontSize: 'clamp(28px, 4vw, 48px)', fontStyle: 'italic', fontWeight: 400, color: 'var(--fg)', lineHeight: 1.15 }}>
                        Selected commissions <br /><span style={{ color: 'var(--accent)' }}>welcomed</span>.
                    </p>
                    <p className="mono mt-5" style={{ fontSize: '10px', letterSpacing: '0.22em', color: 'var(--mute)', textTransform: 'uppercase' }}>
                        hello@andreaonori.com
                    </p>
                </div>

                <div className="colofone">
                    <div>
                        <h4>Volume</h4>
                        <p>III</p>
                        <p className="italic">MMXXV</p>
                    </div>
                    <div>
                        <h4>Studio</h4>
                        <p>Milano</p>
                        <p>Italia</p>
                    </div>
                    <div>
                        <h4>Set in</h4>
                        <p>Fraunces</p>
                        <p>Crimson Pro</p>
                    </div>
                    <div>
                        <h4>Printed</h4>
                        <p>On screen</p>
                        <p className="italic">Anno MMXXV</p>
                    </div>
                </div>

                <div className="flex flex-col md:flex-row justify-between items-center gap-2 pt-6 mono" style={{ borderTop: '1px solid var(--line)', fontSize: '10px', color: 'var(--mute)', letterSpacing: '0.18em', textTransform: 'uppercase' }}>
                    <span>© MMXXV · Andrea Onori</span>
                    <span style={{ color: 'var(--accent)' }}>L'Archive — Edition 02</span>
                </div>
            </footer>
        );

        const App = () => {
            const [active, setActive] = useState('FRAMES');
            const [selectedImg, setSelectedImg] = useState(null);
            const [imgs, setImgs] = useState([]);
            const [selectedChapter, setSelectedChapter] = useState(null);

            const open = (i, list) => { setSelectedImg(i); setImgs(list); };

            return (
                <div style={{ position: 'relative', zIndex: 1 }}>
                    {/* Top issue bar */}
                    <div className="max-w-[1100px] mx-auto px-6 pt-16 pb-2">
                        <div className="issue-header">
                            <span>Volume <strong>III</strong> · MMXXV</span>
                            <span style={{ color: 'var(--accent)' }}>L'Archive</span>
                            <span>Edition <strong>02</strong></span>
                        </div>
                    </div>

                    {/* Hero opening */}
                    <div className="max-w-[1100px] mx-auto px-6 pt-20 pb-6">
                        <HeroQuote />
                    </div>

                    {/* Main content */}
                    <div className="max-w-[1100px] mx-auto px-6 pb-12">
                        <ProfileHeader />
                        <Chapters onClick={setSelectedChapter} />
                        <Tabs active={active} setActive={setActive} />
                        {active === 'FRAMES' && <FeedGrid onClick={open} />}
                        {active === 'MOTION' && <MotionGrid />}
                        {active === 'INDEX' && <IndexView onClick={open} />}
                        <Footer />
                    </div>

                    {selectedImg !== null && (
                        <PostModal
                            idx={selectedImg}
                            images={imgs}
                            onClose={() => setSelectedImg(null)}
                            onNext={() => setSelectedImg((p) => (p + 1) % imgs.length)}
                            onPrev={() => setSelectedImg((p) => (p - 1 + imgs.length) % imgs.length)}
                        />
                    )}
                    {selectedChapter && <ChapterModal chapter={selectedChapter} onClose={() => setSelectedChapter(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
