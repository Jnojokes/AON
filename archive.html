<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andrea__onori — Portfolio</title>
    <meta name="description" content="Photographer based in Italy. Editorial · Portrait · Personal work.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23fff%22/><circle cx=%2250%22 cy=%2250%22 r=%2228%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%224%22/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

    <style>
        :root {
            --bg: #FFFFFF;
            --fg: #000000;
            --soft: #262626;
            --mute: #8E8E8E;
            --line: #DBDBDB;
            --line-soft: #EFEFEF;
            --accent: #000000;
            --accent-hover: #262626;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        html, body { background: var(--bg); color: var(--fg); }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        ::selection { background: var(--fg); color: var(--bg); }

        .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }
        .hel { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        /* Top app bar */
        .appbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--line);
        }
        .appbar-inner {
            max-width: 975px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-family: 'Instrument Serif', serif;
            font-size: 26px;
            letter-spacing: -0.01em;
            font-style: italic;
            line-height: 1;
            color: var(--fg);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .brand .dot { width: 5px; height: 5px; background: var(--fg); border-radius: 50%; display: inline-block; }

        /* Verified blue badge */
        .verified-blue {
            display: inline-flex;
            width: 16px; height: 16px;
            color: var(--accent);
            margin-left: 6px;
            vertical-align: middle;
        }

        /* Version switch — minimal */
        .vswitch {
            position: fixed;
            top: 70px; left: 20px;
            z-index: 50;
            display: inline-flex;
            border: 1px solid var(--fg);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
        }
        .vswitch a {
            padding: 8px 13px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--mute);
            text-decoration: none;
            transition: all .25s var(--ease-out);
        }
        .vswitch a.active { background: var(--fg); color: var(--bg); }
        .vswitch a:not(.active):hover { color: var(--fg); }
        @media (max-width: 768px) {
            .vswitch { top: 70px; left: auto; right: 16px; }
        }

        /* Buttons IG-style */
        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 8px 18px;
            border: none;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s var(--ease-out), transform .2s var(--ease-out);
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            background: #EFEFEF;
            color: var(--fg);
            padding: 8px 18px;
            border: none;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s var(--ease-out), transform .2s var(--ease-out);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-secondary:hover { background: #DBDBDB; }
        .btn-secondary:active { transform: scale(0.96); }

        .btn-icon {
            background: transparent;
            color: var(--fg);
            width: 32px; height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: background .2s var(--ease-out);
        }
        .btn-icon:hover { background: #EFEFEF; }

        .available-dot {
            width: 7px; height: 7px;
            background: #2ECC71;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            animation: pulse 1.8s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* Avatar — black ring, clickable for showreel */
        .avatar-wrap {
            position: relative;
            width: 168px; height: 168px;
            border-radius: 50%;
            padding: 3px;
            background: transparent;
            border: 1.5px solid var(--fg);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform .35s var(--ease-out);
        }
        .avatar-wrap:hover { transform: scale(1.02); }
        .avatar-wrap-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            padding: 0;
            background: var(--bg);
            overflow: hidden;
        }
        .avatar-wrap img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: opacity .3s var(--ease-out);
        }
        .avatar-wrap:hover img { opacity: 0.88; }
        .avatar-wrap .play-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0);
            opacity: 0;
            transition: opacity .35s var(--ease-out), background .35s var(--ease-out);
            pointer-events: none;
        }
        .avatar-wrap:hover .play-overlay {
            opacity: 1;
            background: rgba(0,0,0,0.35);
        }
        .avatar-wrap .play-overlay svg {
            width: 36px; height: 36px;
            color: white;
        }
        @media (max-width: 768px) {
            .avatar-wrap { width: 96px; height: 96px; padding: 2px; }
        }

        /* Highlights — clean black ring */
        .highlight-circle {
            width: 90px; height: 90px;
            border-radius: 50%;
            padding: 3px;
            background: var(--bg);
            border: 1.5px solid var(--fg);
            overflow: hidden;
            cursor: pointer;
            transition: transform .35s var(--ease-out);
            position: relative;
        }
        .highlight-circle:hover { transform: translateY(-3px); }
        .highlight-circle .inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #f4f4f4;
        }
        .highlight-circle img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform .6s var(--ease-out);
        }
        .highlight-circle:hover img { transform: scale(1.08); }
        @media (max-width: 768px) {
            .highlight-circle { width: 70px; height: 70px; padding: 2px; }
        }

        /* Tabs IG style */
        .tabs-row {
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--line);
            margin-top: 32px;
            position: relative;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 18px 36px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--mute);
            cursor: pointer;
            transition: color .3s var(--ease-out);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .tab-btn.active { color: var(--fg); }
        .tab-btn:hover { color: var(--fg); }
        .tab-btn svg { width: 14px; height: 14px; }
        .tab-indicator {
            position: absolute;
            top: -1px;
            height: 1px;
            background: var(--fg);
            transition: left .5s var(--ease-out), width .5s var(--ease-out);
        }
        @media (max-width: 768px) {
            .tab-btn { padding: 14px 20px; font-size: 11px; }
        }

        /* Feed grid IG */
        .feed {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-top: 3px;
        }
        @media (min-width: 768px) {
            .feed { gap: 4px; }
        }
        .feed-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            background: #fafafa;
        }
        .feed-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform .6s var(--ease-out), filter .5s var(--ease-out);
        }
        .feed-item:hover img {
            transform: scale(1.03);
            filter: brightness(0.55);
        }
        .feed-meta {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity .4s var(--ease-out);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 16px;
        }
        .feed-item:hover .feed-meta { opacity: 1; }
        .feed-meta .title {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 22px;
            line-height: 1.1;
        }
        .feed-meta .place {
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.85;
        }
        .feed-item .reel-badge {
            position: absolute;
            top: 10px; right: 10px;
            color: white;
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        .feed-item .reel-badge svg { width: 22px; height: 22px; }

        /* Stats display */
        .stats {
            display: flex;
            gap: 36px;
            margin-bottom: 18px;
        }
        .stats .stat-value { font-weight: 600; color: var(--fg); }
        .stats .stat-label { color: var(--soft); }
        @media (max-width: 768px) {
            .stats {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0;
                border-top: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                padding: 14px 0;
                margin: 14px 0;
                text-align: center;
            }
            .stats > div { display: flex; flex-direction: column; gap: 2px; }
        }

        /* Display name & bio */
        .display-name {
            font-family: 'Instrument Serif', serif;
            font-size: 26px;
            font-weight: 400;
            line-height: 1.1;
            color: var(--fg);
            letter-spacing: -0.01em;
        }
        .bio-line { font-size: 14px; line-height: 1.4; color: var(--fg); }
        .bio-meta { font-size: 13px; color: var(--soft); }
        .bio-link {
            font-size: 14px; color: var(--accent);
            text-decoration: none; font-weight: 600;
            transition: color .2s var(--ease-out);
        }
        .bio-link:hover { color: var(--accent-hover); }

        /* Username row */
        .username-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .username {
            font-size: 22px;
            font-weight: 300;
            color: var(--fg);
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }

        /* Reveal */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
        }
        .reveal-on-scroll.in { opacity: 1; transform: translateY(0); }
        .reveal-on-scroll.delay-1 { transition-delay: .08s; }
        .reveal-on-scroll.delay-2 { transition-delay: .16s; }
        .reveal-on-scroll.delay-3 { transition-delay: .24s; }
        .reveal-on-scroll.delay-4 { transition-delay: .32s; }
        .reveal-on-scroll.delay-5 { transition-delay: .4s; }
        .reveal-on-scroll.delay-6 { transition-delay: .48s; }

        /* Tab panel fade */
        .tab-panel { animation: panelIn .4s var(--ease-out) backwards; }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
            animation: modalFade .25s ease;
            padding: 20px;
            overflow-y: auto;
        }
        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
        .modal-card {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 350px;
            max-height: 88vh;
            animation: modalScale .35s var(--ease-out);
        }
        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 768px) {
            .modal-card { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; }
        }
        .modal-card .left {
            background: #000;
            display: flex; align-items: center; justify-content: center;
            min-height: 400px;
        }
        .modal-card .left img { max-width: 100%; max-height: 88vh; object-fit: contain; }
        .modal-card .right {
            padding: 0;
            display: flex; flex-direction: column;
        }
        .modal-card .right .head {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 12px;
        }
        .modal-card .right .body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }
        .modal-card .right .foot {
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            display: flex; gap: 16px;
            align-items: center;
        }

        /* Story viewer */
        .story-viewer {
            position: fixed; inset: 0;
            background: #000;
            z-index: 200;
            display: flex; flex-direction: column;
        }
        .progress-bars { display: flex; gap: 4px; padding: 14px 20px; }
        .progress-bar { flex: 1; height: 2px; background: rgba(255,255,255,0.3); position: relative; overflow: hidden; border-radius: 1px; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: white; width: 0%; transition: width 50ms linear; }
        .story-content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }

        /* Footer minimal */
        footer.ig-footer {
            margin-top: 80px;
            padding: 40px 24px 60px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: var(--mute);
            font-size: 12px;
            line-height: 2;
        }
        footer.ig-footer a {
            color: var(--mute);
            text-decoration: none;
            margin: 0 8px;
            transition: color .2s var(--ease-out);
        }
        footer.ig-footer a:hover { color: var(--fg); }
        footer.ig-footer .meta {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 13px;
            color: var(--soft);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- Version switch -->
    <div class="vswitch">
        <a href="./bold.html">BOLD / 01</a>
        <a href="./archive.html" class="active">CLEAN / 02</a>
    </div>

    <!-- App bar -->
    <div class="appbar">
        <div class="appbar-inner">
            <a href="./archive.html" class="brand">
                andrea<span style="opacity: 0.5">__</span>onori
            </a>
            <div class="hel" style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute);">
                Portfolio · MMXXV
            </div>
        </div>
    </div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const UNSPLASH = [
            'https://images.unsplash.com/photo-1509631179647-0177331693ae?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1496345875659-11f7dd282d1d?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1492681290082-e932832941e6?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=900&h=900&fit=crop&q=85',
            'https://images.unsplash.com/photo-1488161628813-04466f872be2?w=900&h=900&fit=crop&q=85',
        ];

        // SVG icons
        const VerifiedIcon = () => (
            <svg className="verified-blue" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1L9.7 3.8 6 3.4l-1 3.6L1.7 9 3 12.4 1.7 15.8 5 17.8l1 3.6 3.7-.4L12 23l2.3-2 3.7.4 1-3.6 3.3-2-1.3-3.4L22.3 9 19 7l-1-3.6-3.7.4L12 1zm-1 14.5L7 11.5l1.5-1.5L11 12.5l5-5 1.5 1.5L11 15.5z"/>
            </svg>
        );

        const HeartIcon = () => (
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        );
        const CommentIcon = () => (
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        );
        const ReelIcon = () => (
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <path d="M2 7v10c0 2.21 1.79 4 4 4h12c2.21 0 4-1.79 4-4V7c0-2.21-1.79-4-4-4H6C3.79 3 2 4.79 2 7zm8 8.5v-7l6 3.5-6 3.5z"/>
            </svg>
        );

        // Profile header
        const ProfileHeader = ({ onAvatarClick }) => (
            <div className="max-w-[935px] mx-auto px-6 pt-12 pb-8">
                <div className="flex flex-col md:flex-row gap-8 md:gap-16 items-center md:items-start">
                    {/* Avatar — clickable for showreel */}
                    <div className="reveal-on-scroll">
                        <div className="avatar-wrap" onClick={onAvatarClick} aria-label="Open showreel">
                            <div className="avatar-wrap-inner">
                                <img src="./andrea.jpg" alt="Andrea Onori" />
                            </div>
                            <div className="play-overlay">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                    </div>

                    {/* Profile info */}
                    <div className="flex-1 w-full">
                        <div className="username-row reveal-on-scroll delay-1">
                            <div className="username">
                                andrea__onori
                                <VerifiedIcon />
                            </div>
                            <div className="flex gap-2 flex-wrap">
                                <button className="btn-primary">Get in touch</button>
                                <button className="btn-secondary">
                                    <span className="available-dot"></span>
                                    Available
                                </button>
                            </div>
                        </div>

                        {/* Stats */}
                        <div className="stats reveal-on-scroll delay-2">
                            <div><span className="stat-value">247</span> <span className="stat-label">works</span></div>
                            <div><span className="stat-value">12</span> <span className="stat-label">series</span></div>
                            <div><span className="stat-value">89</span> <span className="stat-label">published</span></div>
                        </div>

                        {/* Bio */}
                        <div className="space-y-1 reveal-on-scroll delay-3">
                            <p className="display-name">Andrea Onori</p>
                            <p className="bio-meta">Photographer · Milan, Italy</p>
                            <p className="bio-line">Editorial · Portrait · Personal work.</p>
                            <p className="bio-meta serif" style={{ fontStyle: 'italic' }}>"The image is what remains."</p>
                            <p style={{ marginTop: '6px' }}>
                                <a href="#" className="bio-link">andreaonori.com</a>
                                <span style={{ color: 'var(--mute)', fontSize: '13px', margin: '0 8px' }}>·</span>
                                <a href="#" className="bio-link" style={{ color: 'var(--soft)' }}>Tearsheets</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );

        // Highlights
        const Highlights = ({ onClick }) => {
            const items = [
                { id: 'editorial', label: 'editorial', image: UNSPLASH[0] },
                { id: 'portraits', label: 'portraits', image: UNSPLASH[1] },
                { id: 'travel', label: 'travel', image: UNSPLASH[2] },
                { id: 'backstage', label: 'backstage', image: UNSPLASH[3] },
                { id: '2025', label: '2025', image: UNSPLASH[4] },
                { id: 'archive', label: 'archive', image: UNSPLASH[5] },
            ];
            return (
                <div className="max-w-[935px] mx-auto px-6">
                    <div className="flex gap-6 overflow-x-auto pb-2">
                        {items.map((item, i) => (
                            <div
                                key={item.id}
                                className={`flex flex-col items-center gap-2 flex-shrink-0 cursor-pointer reveal-on-scroll delay-${Math.min(i + 1, 6)}`}
                                onClick={() => onClick(item)}
                            >
                                <div className="highlight-circle">

                                        <img src={item.image} alt={item.label} />

                                </div>
                                <span style={{ fontSize: '12px', color: 'var(--soft)' }}>{item.label}</span>
                            </div>
                        ))}
                    </div>

            );
        };

        // Tabs
        const Tabs = ({ active, setActive }) => {
            const tabs = [
                { id: 'POSTS', label: 'POSTS', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/><line x1="15" y1="21" x2="15" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg> },
                { id: 'REELS', label: 'REELS', icon: <ReelIcon /> },
            ];
            const refs = useRef([]);
            const [ind, setInd] = useState({ left: 0, width: 0 });
            useEffect(() => {
                const idx = tabs.findIndex(t => t.id === active);
                const el = refs.current[idx];
                if (el) setInd({ left: el.offsetLeft, width: el.offsetWidth });
            }, [active]);

            return (
                <div className="max-w-[935px] mx-auto">
                    <div className="tabs-row">
                        {tabs.map((t, i) => (
                            <button
                                key={t.id}
                                ref={(el) => refs.current[i] = el}
                                className={`tab-btn ${active === t.id ? 'active' : ''}`}
                                onClick={() => setActive(t.id)}
                            >
                                {t.icon}
                                <span>{t.label}</span>
                            </button>
                        ))}
                        <div className="tab-indicator" style={{ left: `${ind.left}px`, width: `${ind.width}px` }}></div>
                    </div>
                </div>
            );
        };

        // Feed
        const FeedGrid = ({ onClick }) => {
            const images = UNSPLASH.map((url, i) => ({
                url,
                title: ['Notturno','Ritratti Urbani','Chiaro di Luna','Cinema Verite','Senza Titolo','Protocollo','Ombre','Luce Diretta','Backstage','Sera','Metropoli','Riflessi'][i],
                year: i < 4 ? '2024' : '2025',
                camera: i % 3 === 0 ? 'Leica M6' : i % 3 === 1 ? 'Hasselblad 503' : 'Leica M11',
                film: i % 3 === 0 ? 'Portra 400' : i % 3 === 1 ? 'Tri-X 400' : 'Digital',
                loc: ['Roma','Milano','Venezia','Milano','Firenze','Milano','Napoli','Torino','Bologna','Roma','Milano','Venezia'][i],
            }));

            return (
                <div className="max-w-[935px] mx-auto px-0">
                    <div className="feed">
                        {images.map((img, i) => (
                            <div key={i} className="feed-item" onClick={() => onClick(i, images)}>
                                <img src={img.url} alt={img.title} loading="lazy" />
                                <div className="feed-meta">
                                    <div className="title">{img.title}</div>
                                    <div className="place">{img.loc} · {img.year}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ReelsGrid = () => {
            const videos = [
                { url: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&h=900&fit=crop&q=85', title: 'Soir blanc', loc: 'Paris' },
                { url: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?w=500&h=900&fit=crop&q=85', title: 'Atelier', loc: 'Milano' },
                { url: 'https://images.unsplash.com/photo-1524522173746-f628baad3644?w=500&h=900&fit=crop&q=85', title: 'Backroom', loc: 'Roma' },
                { url: 'https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=500&h=900&fit=crop&q=85', title: 'Mare', loc: 'Capri' },
                { url: 'https://images.unsplash.com/photo-1513097633097-329a3a64e0d4?w=500&h=900&fit=crop&q=85', title: 'Notte', loc: 'Napoli' },
                { url: 'https://images.unsplash.com/photo-1495556650867-99590cea3657?w=500&h=900&fit=crop&q=85', title: 'Off duty', loc: 'Milano' },
                { url: 'https://images.unsplash.com/photo-1499510318569-1a3d67dc3976?w=500&h=900&fit=crop&q=85', title: 'Studio cut', loc: 'Milano' },
                { url: 'https://images.unsplash.com/photo-1516962126636-27ad087061cc?w=500&h=900&fit=crop&q=85', title: 'Test light', loc: 'Torino' },
                { url: 'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=500&h=900&fit=crop&q=85', title: 'Take 4', loc: 'Venezia' },
            ];
            return (
                <div className="max-w-[935px] mx-auto px-0">
                    <div className="feed" style={{ gridAutoRows: 'auto' }}>
                        {videos.map((v, i) => (
                            <div key={i} className="feed-item" style={{ aspectRatio: '9/16' }}>
                                <img src={v.url} alt={v.title} loading="lazy" />
                                <div className="reel-badge"><ReelIcon /></div>
                                <div className="feed-meta">
                                    <div className="title">{v.title}</div>
                                    <div className="place">{v.loc} · MMXXV</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Modal
        const PostModal = ({ idx, images, onClose, onNext, onPrev }) => {
            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight') onNext();
                    if (e.key === 'ArrowLeft') onPrev();
                };
                window.addEventListener('keydown', onKey);
                document.body.style.overflow = 'hidden';
                return () => {
                    window.removeEventListener('keydown', onKey);
                    document.body.style.overflow = '';
                };
            }, [onClose, onNext, onPrev]);

            const img = images[idx];

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-card" onClick={e => e.stopPropagation()}>
                        <div className="left">
                            <img src={img.url} alt={img.title} />
                        </div>
                        <div className="right">
                            <div className="head">
                                <img src="./andrea.jpg" alt="" style={{ width: '32px', height: '32px', borderRadius: '50%', objectFit: 'cover' }} />
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: 600, fontSize: '14px', display: 'inline-flex', alignItems: 'center' }}>
                                        andrea__onori <VerifiedIcon />
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--soft)' }}>{img.loc}, Italia</div>
                                </div>
                                <button onClick={onClose} className="btn-icon" aria-label="Close">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>
                            </div>

                            <div className="body">
                                <p className="display-name" style={{ fontSize: '24px', marginBottom: '12px' }}>{img.title}</p>
                                <p style={{ fontSize: '14px', lineHeight: 1.5, color: 'var(--fg)', marginBottom: '16px' }}>
                                    Captured during the quiet hours when the city reveals its character. The interplay of artificial light and shadow creates a cinematic quality that transforms ordinary moments into something timeless.
                                </p>
                                <div style={{ fontSize: '13px', color: 'var(--soft)', display: 'grid', gap: '4px' }}>
                                    <div><strong style={{ color: 'var(--fg)' }}>Camera</strong> &nbsp; {img.camera}</div>
                                    <div><strong style={{ color: 'var(--fg)' }}>Film</strong> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; {img.film}</div>
                                    <div><strong style={{ color: 'var(--fg)' }}>Year</strong> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; {img.year}</div>
                                    <div><strong style={{ color: 'var(--fg)' }}>Edition</strong> &nbsp; 03 / 12 — Signed</div>
                                </div>
                            </div>

                            <div className="foot">
                                <button onClick={onPrev} className="btn-icon" aria-label="Previous">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                                </button>
                                <span style={{ fontSize: '12px', color: 'var(--soft)' }}>
                                    {idx + 1} / {images.length}
                                </span>
                                <button onClick={onNext} className="btn-icon" aria-label="Next">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
                                </button>
                                <div style={{ flex: 1 }}></div>
                                <button className="btn-primary" style={{ padding: '8px 16px', fontSize: '13px' }}>Inquire →</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Story viewer
        const StoryViewer = ({ item, onClose }) => {
            const slides = UNSPLASH.slice(0, 5);
            const [cur, setCur] = useState(0);
            const [progress, setProgress] = useState(0);
            const [paused, setPaused] = useState(false);
            const intervalRef = useRef(null);

            useEffect(() => {
                if (!paused) {
                    intervalRef.current = setInterval(() => {
                        setProgress(prev => {
                            if (prev >= 100) {
                                if (cur < slides.length - 1) {
                                    setCur(cur + 1);
                                    return 0;
                                } else { onClose(); return 100; }
                            }
                            return prev + 2;
                        });
                    }, 100);
                }
                return () => intervalRef.current && clearInterval(intervalRef.current);
            }, [cur, paused]);

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                const onKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight' && cur < slides.length - 1) { setCur(cur + 1); setProgress(0); }
                    if (e.key === 'ArrowLeft' && cur > 0) { setCur(cur - 1); setProgress(0); }
                };
                window.addEventListener('keydown', onKey);
                return () => {
                    document.body.style.overflow = '';
                    window.removeEventListener('keydown', onKey);
                };
            }, [cur]);

            return (
                <div className="story-viewer">
                    <div className="progress-bars">
                        {slides.map((_, i) => (
                            <div key={i} className="progress-bar">
                                <div className="progress-fill" style={{ width: i < cur ? '100%' : i === cur ? `${progress}%` : '0%' }}></div>
                            </div>
                        ))}
                    </div>
                    <div className="flex justify-between items-center px-5 pb-2">
                        <div style={{ color: 'white', fontSize: '14px', fontWeight: 500, display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <img src="./andrea.jpg" alt="" style={{ width: '28px', height: '28px', borderRadius: '50%', objectFit: 'cover' }} />
                            <span>andrea__onori</span>
                            <span style={{ opacity: 0.6, fontSize: '12px' }}>· {item.label}</span>
                        </div>
                        <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer' }} aria-label="Close">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div className="story-content">
                        <div style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: '40%', zIndex: 10, cursor: 'pointer' }}
                             onClick={() => cur > 0 && (setCur(cur - 1), setProgress(0))}
                             onMouseDown={() => setPaused(true)}
                             onMouseUp={() => setPaused(false)}
                             onMouseLeave={() => setPaused(false)}
                        ></div>
                        <div style={{ position: 'absolute', top: 0, bottom: 0, right: 0, width: '60%', zIndex: 10, cursor: 'pointer' }}
                             onClick={() => cur < slides.length - 1 ? (setCur(cur + 1), setProgress(0)) : onClose()}
                             onMouseDown={() => setPaused(true)}
                             onMouseUp={() => setPaused(false)}
                             onMouseLeave={() => setPaused(false)}
                        ></div>
                        <img src={slides[cur]} alt="" style={{ maxWidth: '100%', maxHeight: '85vh', objectFit: 'contain', borderRadius: '4px' }} />
                    </div>
                </div>
            );
        };

        // Showreel — autoplay cross-fade reel, opens full-screen from avatar
        const ShowreelModal = ({ onClose }) => {
            const slides = [
                'https://images.unsplash.com/photo-1492681290082-e932832941e6?w=1600&h=1000&fit=crop&q=88',
                'https://images.unsplash.com/photo-1509631179647-0177331693ae?w=1600&h=1000&fit=crop&q=88',
                'https://images.unsplash.com/photo-1496345875659-11f7dd282d1d?w=1600&h=1000&fit=crop&q=88',
                'https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?w=1600&h=1000&fit=crop&q=88',
                'https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?w=1600&h=1000&fit=crop&q=88',
                'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=1600&h=1000&fit=crop&q=88',
            ];
            const [cur, setCur] = useState(0);
            const [progress, setProgress] = useState(0);
            const intervalRef = useRef(null);
            const DURATION_MS = 4200;

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                const onKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight') { setCur((p) => (p + 1) % slides.length); setProgress(0); }
                    if (e.key === 'ArrowLeft') { setCur((p) => (p - 1 + slides.length) % slides.length); setProgress(0); }
                };
                window.addEventListener('keydown', onKey);
                return () => {
                    document.body.style.overflow = '';
                    window.removeEventListener('keydown', onKey);
                };
            }, [onClose]);

            useEffect(() => {
                const tick = 50;
                intervalRef.current = setInterval(() => {
                    setProgress((prev) => {
                        const next = prev + (100 * tick / DURATION_MS);
                        if (next >= 100) {
                            setCur((p) => (p + 1) % slides.length);
                            return 0;
                        }
                        return next;
                    });
                }, tick);
                return () => intervalRef.current && clearInterval(intervalRef.current);
            }, []);

            return (
                <div style={{
                    position: 'fixed', inset: 0, background: '#000',
                    zIndex: 300, display: 'flex', flexDirection: 'column',
                    animation: 'modalFade .35s ease',
                }}>
                    {/* Top bar */}
                    <div style={{
                        position: 'absolute', top: 0, left: 0, right: 0,
                        padding: '20px 28px', zIndex: 10,
                        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                        background: 'linear-gradient(to bottom, rgba(0,0,0,0.5), transparent)',
                    }}>
                        <div className="hel" style={{
                            color: 'white', fontSize: '11px',
                            letterSpacing: '0.22em', textTransform: 'uppercase',
                            display: 'flex', alignItems: 'center', gap: '12px',
                        }}>
                            <img src="./andrea.jpg" alt="" style={{ width: '32px', height: '32px', borderRadius: '50%', objectFit: 'cover', border: '1.5px solid white' }} />
                            <div>
                                <div style={{ fontSize: '13px', textTransform: 'none', letterSpacing: 'normal', fontWeight: 500 }}>andrea__onori</div>
                                <div style={{ opacity: 0.6, marginTop: '2px' }}>Showreel · MMXXV</div>
                            </div>
                        </div>
                        <button onClick={onClose} style={{
                            background: 'rgba(255,255,255,0.08)',
                            border: '1px solid rgba(255,255,255,0.25)',
                            color: 'white', cursor: 'pointer',
                            width: '40px', height: '40px',
                            borderRadius: '50%',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            transition: 'background .25s var(--ease-out)',
                        }}
                        onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.18)'}
                        onMouseLeave={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.08)'}
                        aria-label="Close showreel">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>

                    {/* Progress dots */}
                    <div style={{
                        position: 'absolute', top: '20px', left: '50%',
                        transform: 'translateX(-50%)',
                        display: 'flex', gap: '5px', zIndex: 10,
                    }}>
                        {slides.map((_, i) => (
                            <div key={i} style={{
                                width: '32px', height: '2px',
                                background: 'rgba(255,255,255,0.25)',
                                overflow: 'hidden',
                                borderRadius: '1px',
                            }}>
                                <div style={{
                                    height: '100%', background: 'white',
                                    width: i < cur ? '100%' : i === cur ? `${progress}%` : '0%',
                                    transition: 'width 60ms linear',
                                }}></div>
                            </div>
                        ))}
                    </div>

                    {/* Cross-fade slides */}
                    <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
                        {slides.map((src, i) => (
                            <img key={i} src={src} alt="" style={{
                                position: 'absolute', inset: 0,
                                width: '100%', height: '100%',
                                objectFit: 'cover',
                                opacity: i === cur ? 1 : 0,
                                transition: 'opacity 1.2s var(--ease-out), transform 5s linear',
                                transform: i === cur ? 'scale(1.04)' : 'scale(1)',
                            }} />
                        ))}
                        {/* tap areas */}
                        <div onClick={() => { setCur((p) => (p - 1 + slides.length) % slides.length); setProgress(0); }}
                             style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: '35%', zIndex: 5, cursor: 'pointer' }}></div>
                        <div onClick={() => { setCur((p) => (p + 1) % slides.length); setProgress(0); }}
                             style={{ position: 'absolute', top: 0, bottom: 0, right: 0, width: '65%', zIndex: 5, cursor: 'pointer' }}></div>
                    </div>

                    {/* Bottom caption */}
                    <div style={{
                        position: 'absolute', bottom: 0, left: 0, right: 0,
                        padding: '28px 28px 32px',
                        background: 'linear-gradient(to top, rgba(0,0,0,0.6), transparent)',
                        zIndex: 10,
                    }}>
                        <p className="serif" style={{
                            color: 'white', fontSize: '32px', fontStyle: 'italic',
                            lineHeight: 1.1, maxWidth: '600px',
                        }}>
                            A year in pictures.
                        </p>
                        <p className="hel" style={{
                            color: 'rgba(255,255,255,0.7)',
                            fontSize: '11px',
                            letterSpacing: '0.22em',
                            textTransform: 'uppercase',
                            marginTop: '10px',
                        }}>
                            Frame {String(cur + 1).padStart(2, '0')} / {String(slides.length).padStart(2, '0')}
                        </p>
                    </div>
                </div>
            );
        };

        // Footer IG-style
        const Footer = () => (
            <footer className="ig-footer">
                <div className="reveal-on-scroll">
                    <a href="#">About</a>·
                    <a href="#">Work</a>·
                    <a href="#">Contact</a>·
                    <a href="#">Press</a>·
                    <a href="#">Newsletter</a>·
                    <a href="#">Privacy</a>
                </div>
                <p style={{ marginTop: '10px' }} className="reveal-on-scroll delay-1">© 2025 ANDREA ONORI · Milan, Italy</p>
                <p className="meta reveal-on-scroll delay-2">A photographer's archive — Edition 02 · Clean</p>
            </footer>
        );

        // App
        const App = () => {
            const [active, setActive] = useState('POSTS');
            const [selectedImg, setSelectedImg] = useState(null);
            const [imgs, setImgs] = useState([]);
            const [selectedHighlight, setSelectedHighlight] = useState(null);
            const [showreelOpen, setShowreelOpen] = useState(false);

            const open = (i, list) => { setSelectedImg(i); setImgs(list); };

            // Scroll-triggered reveal
            useEffect(() => {
                const els = document.querySelectorAll('.reveal-on-scroll');
                const io = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('in');
                            io.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });
                els.forEach((el) => io.observe(el));
                return () => io.disconnect();
            }, [active]);

            return (
                <div>
                    <ProfileHeader onAvatarClick={() => setShowreelOpen(true)} />
                    <Highlights onClick={setSelectedHighlight} />
                    <Tabs active={active} setActive={setActive} />
                    <div key={active} className="tab-panel">
                        {active === 'POSTS' && <FeedGrid onClick={open} />}
                        {active === 'REELS' && <ReelsGrid />}
                    </div>
                    <Footer />

                    {selectedImg !== null && (
                        <PostModal
                            idx={selectedImg}
                            images={imgs}
                            onClose={() => setSelectedImg(null)}
                            onNext={() => setSelectedImg((p) => (p + 1) % imgs.length)}
                            onPrev={() => setSelectedImg((p) => (p - 1 + imgs.length) % imgs.length)}
                        />
                    )}
                    {selectedHighlight && <StoryViewer item={selectedHighlight} onClose={() => setSelectedHighlight(null)} />}
                    {showreelOpen && <ShowreelModal onClose={() => setShowreelOpen(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
