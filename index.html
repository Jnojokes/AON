<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea Onori — Two Editions</title>
    <meta name="description" content="Photography portfolio. Two editorial directions to choose from.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%2250%22 fill=%22%23000%22/><rect y=%2250%22 width=%22100%22 height=%2250%22 fill=%22%23fff%22/></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo+Black&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root { --ease-out: cubic-bezier(0.22, 1, 0.36, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

        .stage {
            position: absolute; inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            transition: flex 0.7s var(--ease-out);
        }
        .panel-bold { background: #000000; color: #FFFFFF; }
        .panel-clean { background: #FFFFFF; color: #000000; }

        .panel::before {
            content: '';
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            opacity: 0;
            transition: opacity 0.8s var(--ease-out);
            z-index: 1;
        }
        .panel-bold::before {
            background-image: url('https://images.unsplash.com/photo-1509631179647-0177331693ae?w=1400&h=1400&fit=crop&q=85');
            filter: grayscale(70%) brightness(0.35) contrast(1.15);
        }
        .panel-bold:hover::before { opacity: 1; }
        .panel-clean::before {
            background-image: url('https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?w=1400&h=1400&fit=crop&q=85');
            filter: brightness(1.05) contrast(0.95) saturate(0.9);
        }
        .panel-clean:hover::before { opacity: 0.16; }

        .panel-content {
            position: relative; z-index: 3;
            text-align: center;
            transition: transform 0.7s var(--ease-out);
        }
        .panel:hover .panel-content { transform: translateY(-6px); }

        .panel-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 26px;
        }

        .panel-title-bold {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(40px, 8vw, 110px);
            line-height: 0.92;
            letter-spacing: -0.025em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .panel-title-clean {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-weight: 400;
            font-size: clamp(56px, 9.5vw, 130px);
            line-height: 0.94;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }
        .panel-title-clean .stroke {
            font-style: normal;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        .panel-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.55;
            margin-bottom: 38px;
        }

        .panel-cta {
            display: inline-flex; align-items: center; gap: 14px;
            padding: 14px 28px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            transition: all 0.4s var(--ease-out);
        }
        .panel-bold .panel-cta {
            background: #FFFFFF; color: #000000;
            border: 1px solid #FFFFFF;
        }
        .panel-bold:hover .panel-cta { background: transparent; color: #FFFFFF; }
        .panel-clean .panel-cta {
            background: transparent; color: #000000;
            border: 1px solid #000000;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 0.18em;
        }
        .panel-clean:hover .panel-cta { background: #000000; color: #FFFFFF; }
        .panel-cta .arrow { transition: transform 0.4s var(--ease-out); }
        .panel:hover .panel-cta .arrow { transform: translateX(6px); }

        /* Center crest */
        .crest {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
            display: flex; flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .crest-line {
            width: 1px; height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(140,140,140,0.55), transparent);
        }
        .crest-mark {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.3em;
            color: #888;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
        }
        .crest-mark strong { font-weight: 500; color: #aaa; }

        /* Frame corners */
        .panel-frame {
            position: absolute;
            inset: 16px;
            border: 1px solid currentColor;
            opacity: 0.1;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s var(--ease-out);
        }
        .panel:hover .panel-frame { opacity: 0.28; }

        /* Top bar (inside each panel) */
        .topbar {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 20px 28px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }
        .panel-bold .topbar { color: rgba(255,255,255,0.55); }
        .panel-bold .topbar strong { color: #fff; font-weight: 500; }
        .panel-clean .topbar { color: rgba(0,0,0,0.55); }
        .panel-clean .topbar strong { color: #000; font-weight: 600; }

        .bottombar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 28px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }
        .panel-bold .bottombar { color: rgba(255,255,255,0.5); }
        .panel-clean .bottombar { color: rgba(0,0,0,0.5); }

        .live-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.4s ease-in-out infinite;
            vertical-align: middle;
        }
        .live-dot.bold { background: #FF3D00; }
        .live-dot.clean { background: #2ECC71; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

        /* Reveal stagger */
        .reveal { animation: fadeUp 1.1s var(--ease-out) backwards; }
        .reveal.d1 { animation-delay: 0.15s; }
        .reveal.d2 { animation-delay: 0.3s; }
        .reveal.d3 { animation-delay: 0.45s; }
        .reveal.d4 { animation-delay: 0.6s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            html, body { overflow-y: auto; height: auto; }
            .stage { position: relative; grid-template-columns: 1fr; min-height: 100vh; }
            .panel { min-height: 60vh; padding: 80px 24px; }
            .crest {
                position: relative;
                top: auto; left: auto; transform: none;
                padding: 28px 0;
                background: linear-gradient(to bottom, #000 0%, #000 50%, #fff 50%, #fff 100%);
                width: 100%;
            }
            .crest-line { height: 20px; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <a href="./bold.html" class="panel panel-bold">
            <div class="topbar">
                <div><strong>Andrea Onori</strong> &nbsp;/&nbsp; Portfolio Preview</div>
                <div><span class="live-dot bold"></span>Edition 01</div>
            </div>

            <div class="panel-frame"></div>

            <div class="panel-content">
                <div class="panel-eyebrow reveal d1">Direction A · Brutalist</div>
                <h2 class="panel-title-bold reveal d2">BOLD<br/>/ 25</h2>
                <p class="panel-subtitle reveal d3">Editorial · Brutalist · Dark</p>
                <span class="panel-cta reveal d4">View Edition <span class="arrow">→</span></span>
            </div>

            <div class="bottombar">
                <div>MMXXV</div>
                <div>Hover to peek</div>
            </div>
        </a>

        <a href="./archive.html" class="panel panel-clean">
            <div class="topbar">
                <div><strong>Andrea Onori</strong> &nbsp;/&nbsp; Portfolio Preview</div>
                <div><span class="live-dot clean"></span>Edition 02</div>
            </div>

            <div class="panel-frame"></div>

            <div class="panel-content">
                <div class="panel-eyebrow reveal d1">Direction B · Minimal</div>
                <h2 class="panel-title-clean reveal d2"><em>Clean</em><br/><span class="stroke">/ 02</span></h2>
                <p class="panel-subtitle reveal d3">IG-Clean · White · Soft</p>
                <span class="panel-cta reveal d4">View Edition <span class="arrow">→</span></span>
            </div>

            <div class="bottombar">
                <div>MMXXV</div>
                <div>Click to enter</div>
            </div>
        </a>
    </div>

    <div class="crest">
        <div class="crest-line"></div>
        <div class="crest-mark">CHOOSE<br/><strong>ONE</strong></div>
        <div class="crest-line"></div>
    </div>
</body>
</html>
