<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrea Onori — Filmmaker, Milan</title>
<meta name="description" content="Andrea Onori, filmmaker based in Milan. New site in progress.">

<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#161616">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Umami: statistiche senza cookie, conta solo sul dominio vero (data-domains). -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="6f54222f-5c21-4707-be4f-d71137780c5a" data-domains="andreaonori.com,www.andreaonori.com"></script>
<!--
  WORK IN PROGRESS v6 — pagina d'attesa di andreaonori.com (25/10)
  Una schermata sola, senza scorrere (stile home H8): sfondo sfocato a tutto
  schermo con un velo del colore dello sfondo al 50%; al centro
  "● WORK IN PROGRESS", poi "Andrea Onori" (Roboto 500), la scritta
  FILM-MAKER · BASED IN MILAN (Roboto) e due rettangoli: INSTAGRAM / ↗ FOLLOW e
  CONTACT ME / STAND BY → REC. In fondo la riga con P. IVA, mail e link legali.
  Sfondo temporaneo: il montaggio sfocato dei lavori (media/wip-reel.webp).
  Solo HTML + CSS: niente JavaScript, niente cookie, nessun servizio esterno.
  Se lo schermo e' troppo basso (telefono in orizzontale) la pagina scorre.
-->
<style>
    :root {
        --bg: #161616; --fg: #fff; --mute: #707070;
        --cell: #1E1E1E;
        --line: rgba(255,255,255,0.12);
        --accent: #FF3D00;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --gap: 20px; --side: 40px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--fg); }
    body {
        font-family: 'Roboto', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--fg); color: var(--bg); }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .uline { letter-spacing: 0.18em; text-transform: uppercase; }
    .wrap { padding: 0 var(--side); width: 100%; }

    /* ── Sfondo fisso a tutto schermo: montaggio sfocato + velo al 50% ── */
    .bg { position: fixed; inset: 0; height: 100vh; height: 100lvh; z-index: 0; overflow: hidden; background: #0a0a0a; }
    .bg img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.04); }
    .bg::after { content: ''; position: absolute; inset: 0; background: var(--bg); opacity: .5; }
    /* ── Prima schermata: barra in alto, intestazione al centro ── */
    .hero {
        position: relative; z-index: 1;
        min-height: 100vh; min-height: 100svh;
        display: flex; flex-direction: column;
    }
    .topbar { border-bottom: 1px solid var(--line); }
    .topbar .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; padding-bottom: 12px; }
    .topbar .right { font-size: 9px; color: rgba(255,255,255,.78); }
    /* al centro dello schermo */
    .profile {
        margin: auto 0; padding-top: 32px; padding-bottom: 32px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    /* sopra il nome: pallino arancio che lampeggia + WORK IN PROGRESS */
    /* un po' piu' grande della v6 (richiesta di Andrea, 25/10) */
    .kicker { display: inline-flex; align-items: center; gap: 12px; font-size: 13px; color: rgba(255,255,255,.78); margin-bottom: 24px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    h1 {
        font-family: 'Roboto', sans-serif; font-weight: 500;
        white-space: nowrap;
        font-size: clamp(40px, 6.5vw, 112px); line-height: .95; letter-spacing: -.03em;
        margin-bottom: 10px;
    }
    /* scritta sotto il nome: Roboto, senza pallino, bianca al 78% */
    .eyebrow {
        font-family: 'Roboto', sans-serif; font-weight: 400;
        font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
        color: rgba(255,255,255,.78);
    }

    /* ── Due rettangoli a due piani, centrati ── */
    .btn-row { display: flex; justify-content: center; gap: 12px; margin-top: 32px; }
    .cbtn {
        height: 84px; min-width: 168px; padding: 0 28px;
        display: inline-flex; flex-direction: column; align-items: stretch;
        font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
        letter-spacing: .18em; text-transform: uppercase; white-space: nowrap;
        background: linear-gradient(to bottom, #fff 0 50%, rgba(255,255,255,.12) 50% 100%);
        transition: background .35s var(--ease-out);
    }
    .cbtn-top, .cbtn-bot { height: 50%; display: flex; align-items: center; justify-content: center; }
    .cbtn-top { color: #161616; }
    .cbtn-top > span { display: inline-block; transition: transform .35s var(--ease-out); }
    .cbtn-bot { gap: 9px; color: rgba(244,242,238,.55); transition: color .35s var(--ease-out); }
    .cbtn-dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; transition: background .25s; }
    .cbtn-hover { display: none; }
    .cbtn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    /* stati col mouse (solo dove il mouse c'è) e col focus da tastiera */
    @media (hover: hover) {
        .cbtn:hover { background: linear-gradient(to bottom, #fff 0 50%, rgba(255,255,255,.22) 50% 100%); }
        .cbtn:hover .cbtn-bot { color: rgba(244,242,238,.9); }
        .cbtn:hover .cbtn-top > span { transform: scale(1.08); }
        .cbtn.contact:hover .cbtn-dot { background: #ff3b30; animation: recblink 1.2s ease-in-out infinite; }
        .cbtn.contact:hover .cbtn-idle { display: none; }
        .cbtn.contact:hover .cbtn-hover { display: inline; }
    }
    .cbtn:focus-visible { background: linear-gradient(to bottom, #fff 0 50%, rgba(255,255,255,.22) 50% 100%); }
    .cbtn:focus-visible .cbtn-bot { color: rgba(244,242,238,.9); }
    .cbtn:focus-visible .cbtn-top > span { transform: scale(1.08); }
    .cbtn.contact:focus-visible .cbtn-dot { background: #ff3b30; animation: recblink 1.2s ease-in-out infinite; }
    .cbtn.contact:focus-visible .cbtn-idle { display: none; }
    .cbtn.contact:focus-visible .cbtn-hover { display: inline; }
    @keyframes recblink { 0%, 55% { opacity: 1; } 70%, 100% { opacity: .2; } }

    /* ── Footer ── */
    /* footer in fondo alla stessa schermata */
    footer { border-top: 1px solid var(--line); padding: 18px 0 20px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; font-size: 9px; color: rgba(255,255,255,.6); }
    footer a { border-bottom: 1px solid transparent; transition: border-color .3s; }
    footer a:hover { color: var(--fg); border-color: var(--fg); }
    footer .links { display: flex; gap: 18px; flex-wrap: wrap; }

    /* ── Telefono ── */
    @media (max-width: 767px) {
        :root { --gap: 6px; --side: 20px; }
        .btn-row { width: 100%; gap: 8px; }
        .btn-row .cbtn { flex: 1 1 0; min-width: 0; padding: 0 12px; }
        .kicker { font-size: 11px; gap: 10px; }
        /* footer da telefono: tre righe ordinate */
        footer .wrap { font-size: 8px; flex-direction: column; gap: 10px; }
        footer .sep { display: none; }
        footer .piva { display: block; margin-top: 4px; }
        footer .links { gap: 8px 16px; }
    }
    /* Movimento ridotto: sfondo fermo (copertina), niente lampeggi */
    @media (prefers-reduced-motion: reduce) {
        .live-dot, .cbtn .cbtn-dot { animation: none !important; }
        .cbtn-top > span { transition: none; }
    }
</style>
</head>
<body>

    <div class="bg" aria-hidden="true">
        <picture>
            <source media="(prefers-reduced-motion: reduce)" srcset="/media/wip-reel-poster.jpg">
            <img src="/media/wip-reel.webp" alt="" decoding="async">
        </picture>
    </div>

    <div class="hero" id="hero">
        <div class="topbar">
            <div class="wrap">
                <div class="mono uline" style="font-size:10px">andrea__onori</div>
                <div class="mono uline right">ARCHIVE / 26 · VOLUME 01</div>
            </div>
        </div>

        <header class="profile wrap">
            <div class="kicker mono uline"><i class="live-dot" aria-hidden="true"></i>Work in progress</div>
            <h1>Andrea Onori</h1>
            <div class="eyebrow">Film-maker · Based in Milan</div>
            <div class="btn-row">
                <a class="cbtn" href="https://www.instagram.com/andrea__onori" rel="noopener" aria-label="Instagram">
                    <span class="cbtn-top"><span>Instagram</span></span>
                    <span class="cbtn-bot" aria-hidden="true"><span>↗ Follow</span></span>
                </a>
                <a class="cbtn contact" href="mailto:video@andreaonori.com?subject=Production%20enquiry" aria-label="Contact me">
                    <span class="cbtn-top"><span>Contact me</span></span>
                    <span class="cbtn-bot" aria-hidden="true"><i class="cbtn-dot"></i><span class="cbtn-idle">Stand by</span><span class="cbtn-hover">Rec</span></span>
                </a>
            </div>
        </header>

        <footer>
            <div class="wrap mono uline">
                <span>© 2026 Andrea Onori — Milan, Italy<span class="sep"> · </span><span class="piva">P. IVA 02491850448</span></span>
                <span class="links">
                    <a href="mailto:video@andreaonori.com">video@andreaonori.com</a>
                    <a href="/privacy">Privacy</a>
                    <a href="/note-legali">Note legali</a>
                </span>
            </div>
        </footer>
    </div>

</body>
</html>
